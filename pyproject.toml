[project]
name = "preset-sync-worker"
version = "0.1.0"
description = "Synchronizes Feishu Bitable material submissions to Git-backed presets."
requires-python = ">=3.11"
dependencies = [
    "lark-oapi",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
preset-sync-worker = "preset_sync_worker.main:main"
